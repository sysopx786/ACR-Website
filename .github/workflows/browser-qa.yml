name: ACR browser and accessibility QA

on:
  push:
    paths:
      - .github/workflows/browser-qa.yml
      - scripts/browser-qa.cjs
      - dist/styles.css
      - dist/script.js
      - dist/index.html
      - dist/es/results/index.html
      - dist/results/index.html
      - dist/faq/index.html
      - dist/es/faq/index.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright axe-core
          npx playwright install --with-deps chromium
      - name: Test navigation, mobile, Spanish gallery and accessibility
        id: browser_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/browser-qa.cjs 2>&1 | tee browser-qa-output.log
      - name: Store readable browser QA result
        if: always()
        env:
          BROWSER_OUTCOME: ${{ steps.browser_tests.outcome }}
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p qa
          node - <<'NODE'
          const fs=require('fs');
          const log=fs.existsSync('browser-qa-output.log')?fs.readFileSync('browser-qa-output.log','utf8'):'Test did not start (check dependency/setup steps).';
          fs.writeFileSync('qa/latest-browser-qa.json',JSON.stringify({
            workflow:'ACR browser and accessibility QA',
            testedCommit:process.env.GITHUB_SHA,
            result:process.env.BROWSER_OUTCOME,
            runUrl:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,
            completedAt:new Date().toISOString(),
            log:log.slice(-25000)
          },null,2)+String.fromCharCode(10));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/latest-browser-qa.json
          if ! git diff --cached --quiet; then
            git commit -m "Record latest ACR browser QA results [skip ci]"
            git push origin HEAD:main
          fi
      - name: Fail when browser testing fails
        if: steps.browser_tests.outcome != 'success'
        run: exit 1
      - name: Save browser screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acr-browser-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
