name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download approved restoration photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_2yjODSAkv4hC5W0OWhtp3cqVHm5/e577732b-1197-4952-9ee9-1e17beb97b2d.jpg' -o 'dist/assets/process-assess.jpg'
          test -s 'dist/assets/process-assess.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_2yjODSAkv4hC5W0OWhtp3cqVHm5/db5aec22-b572-4589-8d77-52a8f0467916.jpg' -o 'dist/assets/process-sort.jpg'
          test -s 'dist/assets/process-sort.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_2yjODSAkv4hC5W0OWhtp3cqVHm5/a4e8ff17-95ab-4b74-874a-fd0bf263e735.jpg' -o 'dist/assets/process-clean.jpg'
          test -s 'dist/assets/process-clean.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_2yjODSAkv4hC5W0OWhtp3cqVHm5/f4ce6312-2d74-45e8-af10-08ee3d48a53e.jpg' -o 'dist/assets/process-restore.jpg'
          test -s 'dist/assets/process-restore.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_2yjODSAkv4hC5W0OWhtp3cqVHm5/aefebb9e-6ac2-4de2-9153-8a52cf6c8446.jpg' -o 'dist/assets/process-finish.jpg'
          test -s 'dist/assets/process-finish.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_2yjODSAkv4hC5W0OWhtp3cqVHm5/871f65b1-807b-4d88-a809-4749a92abb16.jpg' -o 'dist/assets/process-return.jpg'
          test -s 'dist/assets/process-return.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_2yjODSAkv4hC5W0OWhtp3cqVHm5/bd36e572-f054-4a4f-96ae-fafb378a0e86.jpg' -o 'dist/assets/loss-water.jpg'
          test -s 'dist/assets/loss-water.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_2yjODSAkv4hC5W0OWhtp3cqVHm5/28b122c7-74f5-4b0d-a79a-cbc6f1b9ed11.jpg' -o 'dist/assets/hero-garment-racks.jpg'
          test -s 'dist/assets/hero-garment-racks.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_2yjODSAkv4hC5W0OWhtp3cqVHm5/89def0ed-4672-4e61-bfa9-503e10dbbd66.jpg' -o 'dist/assets/craft-fabric-macro.jpg'
          test -s 'dist/assets/craft-fabric-macro.jpg'

      - name: Audit internal links, assets, languages and image galleries
        run: node scripts/check-site.cjs

      - name: Check for repeated content
        run: node scripts/check-duplicate-copy.cjs

      - name: Verify Chester County pages
        run: |
          test -s dist/index.html
          test -s dist/chester-county-clothing-restoration/index.html
          test -s dist/es/chester-county-clothing-restoration/index.html
          test -s dist/sitemap.xml
          grep -q 'Chester County' dist/chester-county-clothing-restoration/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm published reviews match current source
        shell: bash
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 20 --output /tmp/acr-published.html "https://sysopx786.github.io/ACR-Website/?deployment-check=${GITHUB_SHA}" && grep -Fq 'Rachel M.' /tmp/acr-published.html && grep -Fq 'Review Drafts' /tmp/acr-published.html && ! grep -Fq 'id="google-reviews"' /tmp/acr-published.html; then
              echo 'PASS: Published homepage contains the updated review drafts and no previous Google review section.'
              exit 0
            fi
            sleep 10
          done
          echo 'FAIL: Published homepage does not match updated review drafts.' >&2
          exit 1
