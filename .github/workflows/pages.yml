name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Audit internal links, assets, languages and image galleries
        run: node scripts/check-site.cjs

      - name: Check for repeated content
        run: node scripts/check-duplicate-copy.cjs

      - name: Verify Chester County pages
        run: |
          test -s dist/index.html
          test -s dist/chester-county-clothing-restoration/index.html
          test -s dist/es/chester-county-clothing-restoration/index.html
          test -s dist/sitemap.xml
          grep -q 'Chester County' dist/chester-county-clothing-restoration/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm published reviews match current source
        shell: bash
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 20 --output /tmp/acr-published.html "https://sysopx786.github.io/ACR-Website/?deployment-check=${GITHUB_SHA}" && grep -Fq 'Rachel M.' /tmp/acr-published.html && grep -Fq 'Review Drafts' /tmp/acr-published.html && ! grep -Fq 'id="google-reviews"' /tmp/acr-published.html; then
              echo 'PASS: Published homepage contains the updated review drafts and no previous Google review section.'
              exit 0
            fi
            sleep 10
          done
          echo 'FAIL: Published homepage does not match updated review drafts.' >&2
          exit 1
