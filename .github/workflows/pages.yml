name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Audit internal links, assets, languages and image galleries
        run: node scripts/check-site.cjs

      - name: Verify Chester County pages
        run: |
          test -s dist/index.html
          test -s dist/chester-county-clothing-restoration/index.html
          test -s dist/es/chester-county-clothing-restoration/index.html
          test -s dist/sitemap.xml
          grep -q 'Chester County' dist/chester-county-clothing-restoration/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
